server {
    listen 80;
    server_name _;

    # 根路径引导到前端子路径，避免访问 / 时 404。
    location = / {
        return 302 /scaffold-ui/;
    }

    # 前端 SPA：子路径部署（必须跟 VITE_APP_BASE 保持一致）。
    # alias 会把 /scaffold-ui/foo 映射到 /usr/share/nginx/html/foo。
    # try_files 的 fallback 必须写全前缀路径，否则深链接刷新会 404。
    location /scaffold-ui/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /scaffold-ui/index.html;
    }

    # API 网关前缀（对应 VITE_API_PREFIX=/scaffold-api）。
    # proxy_pass 末尾必须带 '/'——nginx 会把 /scaffold-api/ 前缀剥掉，
    # 后端只看到 /api/... 原生路径，无需配 server.servlet.context-path。
    location /scaffold-api/ {
        proxy_pass http://back:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
