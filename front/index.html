<!doctype html>
<html lang="zh-cmn-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fanshu-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <link rel="preconnect" href="https://static-card.dushu365.com" />
    <link rel="dns-prefetch" href="//gateway-api.dushu365.com" />
    <link rel="dns-prefetch" href="//cdn-upyun-images.dushu365.com" />
    <link rel="dns-prefetch" href="//cdn-web-images.dushu365.com" />
    <link rel="dns-prefetch" href="//g.alicdn.com" />
    <script>
      window.setToken = function (token) {
        if (window.token !== token) {
          window.location.reload();
        }
        window.token = token;
      };
      window.generalPurpose_setGlobalData = function () {
        var t = arguments.length > 0 && void 0 !== arguments[0] ? arguments[0] : {};
        try {
          Object.keys(t).map(function (e) {
            window[e] = t[e];
          });
        } catch (e) {}
      };
      window.FILES = {css: [], js: []};
      window.OPTIONS = {
        disableSensor: '%VITE_DISABLE_SENSORS%' === 'true'
      };
      window.IS_IPAD = '%VITE_IS_IPAD%' === 'true';
      window.PACKAGE_NAME = '<%- packageName %>';
      window.PACKAGE_VERSION = '<%- packageVersion %>';
    </script>
    <script src="https://gateway-api.dushu365.com/compose-orch/commonScriptConfig/getFrontScriptConfig"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Load common.init first (synchronous via document.write) -->
    <script>
      (function() {
        try {
          if (!window.STATIC_CARD || !window.GLOBAL_LIBS || !window.GLOBAL_LIBS['@soybean/common.init']) {
            console.error('Missing required globals: STATIC_CARD or GLOBAL_LIBS');
            throw new Error('Configuration not loaded');
          }
          
          var scriptSrc = window.STATIC_CARD + '/@soybean/common.init/dist/react@' + window.GLOBAL_LIBS['@soybean/common.init'] + '.min.js';
          document.write('<script src="' + scriptSrc + '"><' + '/script>');
        } catch (e) {
          console.error('Failed to load common.init:', e);
          document.write('<div style="padding: 20px; color: red; font-family: sans-serif;">加载依赖失败,请刷新页面重试。<button onclick="location.reload()" style="margin-left: 10px;">刷新</button></div>');
        }
      })();
    </script>

    <!-- Now load the app (module script defers execution until after common.init) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
