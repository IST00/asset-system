services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  back:
    build: ./back
    environment:
      FLASK_ENV: ${APP_ENV:-dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  front:
    build: ./front
    ports:
      - "80:80"
    depends_on:
      - back
