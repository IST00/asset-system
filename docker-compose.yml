services:
  back:
    build: ./back
    restart: unless-stopped
    env_file:
      - ${BACK_ENV_FILE:-./back/.env.deploy}
    environment:
      FLASK_ENV: ${APP_ENV:-prod}
      TZ: UTC
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/readiness', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  front:
    build: ./front
    restart: unless-stopped
    environment:
      TZ: UTC
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      back:
        condition: service_healthy
